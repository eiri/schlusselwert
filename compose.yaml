services:
  schlusselwert:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      nginx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private

  nginx:
    image: nginx:1.28.0-alpine3.21
    volumes:
      - ./priv/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - private

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: schlusselwert
      POSTGRES_USER: schlusselwert
      POSTGRES_PASSWORD: dev-postgres-password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schlusselwert -d schlusselwert"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - private

  redis:
    image: redis:8.2.1-alpine3.22
    command: ["redis-server", "--requirepass", "dev-redis-password"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-redis-password", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - private

networks:
  private:
    driver: bridge
