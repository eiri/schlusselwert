[tools]
erlang = "29.0.6"
rebar = "3.27.0"
k6 = "2.3.0"

[tasks.format]
run = "rebar3 fmt --write"

[tasks.test]
run = "rebar3 eunit"

[tasks.check]
run = [
  "rebar3 compile",
  "rebar3 fmt --check",
  "rebar3 eunit",
  "rebar3 dialyzer",
]

[tasks.bench]
run = "rebar3 as bench compile && erl -pa _build/bench/lib/schlusselwert/ebin -noshell -s schlusselwert_bench run -s init stop"

[tasks.dev]
run = "docker compose up --build --detach --wait"

[tasks.smoke]
run = '''
for attempt in $(seq 1 30); do
  curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
  test "$attempt" -eq 30 && exit 1
  sleep 1
done
k6 run scripts/smoke.js
'''
